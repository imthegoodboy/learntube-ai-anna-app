<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4efe3" />
    <title>LearnTube AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to lesson workspace</a>

    <div class="app-shell" id="app-shell">
      <aside class="rail" aria-label="LearnTube navigation">
        <a class="brand" href="#/capture" aria-label="LearnTube AI home">
          <span class="brand-mark" aria-hidden="true">LT</span>
          <span class="brand-copy">LearnTube<small>study what sticks</small></span>
        </a>

        <nav class="primary-nav" aria-label="Workspace pages">
          <a href="#/capture" data-route-link="capture"><span aria-hidden="true">＋</span> Capture</a>
          <a href="#/notes" data-route-link="notes"><span aria-hidden="true">↳</span> Notes</a>
          <a href="#/cards" data-route-link="cards"><span aria-hidden="true">◇</span> Cards</a>
          <a href="#/quiz" data-route-link="quiz"><span aria-hidden="true">?</span> Quiz</a>
          <a href="#/roadmap" data-route-link="roadmap"><span aria-hidden="true">→</span> Roadmap</a>
          <a href="#/mentor" data-route-link="mentor"><span aria-hidden="true">✦</span> Mentor</a>
          <a href="#/library" data-route-link="library"><span aria-hidden="true">⌂</span> Library</a>
        </nav>

        <div class="rail-progress" aria-label="Study progress">
          <span id="rail-xp">0 XP</span>
          <span id="rail-streak">0 day streak</span>
        </div>
      </aside>

      <main class="workspace" id="workspace" tabindex="-1">
        <header class="workspace-header">
          <div>
            <p class="eyebrow" id="page-eyebrow">NEW LESSON</p>
            <h1 id="page-title">Turn watch time into recall.</h1>
          </div>
          <div class="lesson-switcher" id="lesson-switcher" hidden>
            <label for="active-lesson-select">Lesson</label>
            <select id="active-lesson-select" aria-label="Choose active lesson"></select>
          </div>
        </header>

        <div class="sync-strip" id="sync-strip" role="status" aria-live="polite">
          <span class="sync-dot" aria-hidden="true"></span>
          <span id="sync-copy">Connecting to Anna…</span>
        </div>

        <section class="page" id="page" aria-live="polite"></section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="busy-layer" id="busy-layer" hidden>
      <div class="busy-note" role="status" aria-live="assertive">
        <span class="busy-scribble" aria-hidden="true"></span>
        <strong id="busy-title">Building your lesson…</strong>
        <span id="busy-detail">Reading the source</span>
        <div class="busy-track" aria-hidden="true"><span id="busy-progress"></span></div>
        <button class="text-button" id="cancel-generation" type="button">Cancel</button>
      </div>
    </div>

    <!-- Generated by Anna during local development and publishing. -->
    <script src="anna-tool-ids.js"></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
