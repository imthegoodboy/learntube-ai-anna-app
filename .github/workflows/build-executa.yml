name: Build LearnTube Executa

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag for these binaries
        required: true
        default: learntube-study-transcript-v1.0.4
  push:
    tags:
      - "learntube-study-transcript-v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            archive: tar.gz
          - os: macos-15-intel
            target: darwin-x86_64
            archive: tar.gz
          - os: ubuntu-22.04
            target: linux-x86_64
            archive: tar.gz
          - os: windows-2022
            target: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: executas/my-first-anna-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install . pyinstaller==6.15.0
      - name: Build executable
        run: python -m PyInstaller --clean --onefile --name tool-nikku696969-learntube-study-transcript-ujzngt7x my_first_anna_app_plugin.py
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="tool-nikku696969-learntube-study-transcript-ujzngt7x-1.0.4-${{ matrix.target }}.tar.gz"
          mkdir -p package/bin
          cp dist/tool-nikku696969-learntube-study-transcript-ujzngt7x package/bin/
          tar -czf "dist/$archive" -C package bin/tool-nikku696969-learntube-study-transcript-ujzngt7x
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "tool-nikku696969-learntube-study-transcript-ujzngt7x-1.0.4-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force -Path package/bin | Out-Null
          Copy-Item -LiteralPath dist/tool-nikku696969-learntube-study-transcript-ujzngt7x.exe -Destination package/bin/
          Compress-Archive -Path package/bin -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$archive").Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath "dist/$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: tool-nikku696969-learntube-study-transcript-ujzngt7x-1.0.4-${{ matrix.target }}
          path: |
            executas/my-first-anna-app/dist/tool-nikku696969-learntube-study-transcript-ujzngt7x-1.0.4-${{ matrix.target }}.${{ matrix.archive }}
            executas/my-first-anna-app/dist/tool-nikku696969-learntube-study-transcript-ujzngt7x-1.0.4-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "LearnTube Study Transcript v1.0.4" --notes "Four-platform Anna Executa binaries with resilient public-caption retrieval and the production initialize/describe/invoke/shutdown handshake required by Anna Agents." --repo "$GITHUB_REPOSITORY"
          fi
